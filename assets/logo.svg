<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Non-Black Deep Royal Indigo/Cobalt Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E46"/>
      <stop offset="45%" stop-color="#1D2A68"/>
      <stop offset="100%" stop-color="#2B1B54"/>
    </linearGradient>

    <!-- Ambient Glow Spots -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-core" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>

    <!-- Multi-Color Alpha Core Gradient -->
    <linearGradient id="alpha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="35%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Vibrant Multi-Color Panels) -->
    <!-- Top Face: Electric Cyan to Aquamarine -->
    <linearGradient id="panel-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Left Face: Royal Violet to Electric Indigo -->
    <linearGradient id="panel-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Right Face: Neon Coral / Magenta to Golden Amber -->
    <linearGradient id="panel-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filter for Core Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Non-Black Vibrant Base Canvas -->
  <rect width="500" height="500" rx="90" fill="url(#bg-grad)"/>
  <rect width="500" height="500" rx="90" fill="url(#glow-cyan)"/>
  <rect width="500" height="500" rx="90" fill="url(#glow-purple)"/>

  <!-- Quant Polar Radar Grid & Ticks (Vibrant Indigo & Cyan) -->
  <circle cx="250" cy="220" r="190" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.35"/>
  <circle cx="250" cy="220" r="145" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2,6" opacity="0.25"/>
  <circle cx="250" cy="220" r="85" fill="none" stroke="#00FFA3" stroke-width="1" stroke-dasharray="3,5" opacity="0.4"/>
  <circle cx="250" cy="220" r="70" fill="url(#glow-core)"/>

  <!-- Compass Cardinal Ticks (Bright Colors) -->
  <line x1="250" y1="35" x2="250" y2="55" stroke="#00FFA3" stroke-width="2.5"/>
  <line x1="250" y1="385" x2="250" y2="405" stroke="#00FFA3" stroke-width="2.5"/>
  <line x1="60" y1="220" x2="80" y2="220" stroke="#00F0FF" stroke-width="2.5"/>
  <line x1="420" y1="220" x2="440" y2="220" stroke="#F43F5E" stroke-width="2.5"/>

  <!-- Candlestick Depth Bars in Background (Multi-color) -->
  <g opacity="0.35">
    <line x1="85" y1="165" x2="85" y2="265" stroke="#00FFA3" stroke-width="1.5"/>
    <rect x="81" y="190" width="8" height="45" rx="2" fill="#00FFA3"/>
    <line x1="110" y1="135" x2="110" y2="225" stroke="#00F0FF" stroke-width="1.5"/>
    <rect x="106" y="155" width="8" height="40" rx="2" fill="#00F0FF"/>
    <line x1="390" y1="145" x2="390" y2="255" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="386" y="170" width="8" height="50" rx="2" fill="#F43F5E"/>
    <line x1="415" y1="175" x2="415" y2="285" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="411" y="205" width="8" height="45" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Decompiled Black-Box Mechanism (Multi-Color Isometric Disassembly) -->
  <g transform="translate(250, 220)">
    <!-- Exploded Colored Panels Peeling Back -->
    <!-- Top Face (Electric Cyan / Aquamarine) -->
    <polygon points="0,-130 75,-88 0,-46 -75,-88" fill="url(#panel-top)" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="0" y1="-88" x2="0" y2="-46" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>

    <!-- Left Face (Royal Violet / Indigo) -->
    <polygon points="-135,-42 -85,-16 -85,68 -135,42" fill="url(#panel-left)" stroke="#A78BFA" stroke-width="2.5"/>
    <line x1="-135,-42" x2="-85,68" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="3,4" opacity="0.7"/>

    <!-- Right Face (Neon Coral / Golden Amber) -->
    <polygon points="135,-42 85,-16 85,68 135,42" fill="url(#panel-right)" stroke="#FDA4AF" stroke-width="2.5"/>
    <line x1="135,-42" x2="85,68" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="3,4" opacity="0.7"/>

    <!-- Bottom Chassis Support Grid (Vibrant Blue) -->
    <polygon points="0,118 75,76 0,34 -75,76" fill="#1E293B" fill-opacity="0.4" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Reverse Engineering Ejection Vectors / Directional Flow Arrows -->
    <!-- Upward Vector (Cyan) -->
    <g stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-130" x2="0" y2="-155"/>
      <polyline points="-7,-146 0,-155 7,-146" fill="none"/>
    </g>
    <!-- Leftward Vector (Emerald) -->
    <g stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round">
      <line x1="-135" y1="0" x2="-160" y2="-12"/>
      <polyline points="-149,-19 -160,-12 -155,-1" fill="none"/>
    </g>
    <!-- Rightward Vector (Coral Pink) -->
    <g stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round">
      <line x1="135" y1="0" x2="160" y2="-12"/>
      <polyline points="155,-1 160,-12 149,-19" fill="none"/>
    </g>
    <!-- Downward Vector (Golden Amber) -->
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="118" x2="0" y2="142"/>
      <polyline points="-7,133 0,142 7,133" fill="none"/>
    </g>

    <!-- The Glowing Extracted Core: The Sovereign Alpha -->
    <!-- Core Chamber (Vibrant Indigo-Sapphire background with luminous border) -->
    <circle cx="0" cy="12" r="54" fill="#111B3C" stroke="#00FFA3" stroke-width="3"/>
    <circle cx="0" cy="12" r="46" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.8"/>

    <!-- Glowing Multi-Color Alpha Ribbon -->
    <g filter="url(#neon-glow)">
      <!-- Main Alpha Curve (Left loop crossing over into right tail) -->
      <path d="M 28,-8 
               C 14,-8 -2,14 -16,28 
               C -25,28 -32,16 -32,4 
               C -32,-8 -22,-18 -10,-18 
               C 3,-18 15,-6 22,12 
               C 27,22 34,26 42,26" 
            fill="none" stroke="url(#alpha-grad)" stroke-width="8.5" stroke-linecap="round"/>
    </g>
    <!-- Luminous Highlights on Alpha Curve -->
    <circle cx="22" cy="12" r="3.5" fill="#FFFFFF"/>
    <circle cx="-16" cy="28" r="3" fill="#00FFA3"/>
    <circle cx="-10" cy="-18" r="2.5" fill="#00F0FF"/>
  </g>

  <!-- Typography: Only RECURSIVE ALPHA as requested -->
  <text x="250" y="438" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="5">RECURSIVE ALPHA</text>
</svg>