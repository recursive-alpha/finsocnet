<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Non-Black Royal Cobalt / Deep Indigo Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#16234D"/>
      <stop offset="100%" stop-color="#241B4B"/>
    </linearGradient>

    <!-- Vibrant Multi-Color Gradient for the Mark -->
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Ambient Center Luminous Glow -->
    <radialGradient id="aura" cx="48%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Non-Black Rounded Organization Container -->
  <rect width="500" height="500" rx="90" fill="url(#bg-grad)"/>
  <circle cx="240" cy="210" r="145" fill="url(#aura)"/>

  <!-- Minimalist Recursive Alpha Mark (The Name in Pure Geometry) -->
  <g transform="translate(250, 210)">
    <!-- Main Bold Continuous Alpha Stroke: Start top-right, loop around left, cross over, exit bottom-right -->
    <path d="M 85,-75 
             C 45,-75 10,-25 -35,30 
             C -65,65 -115,65 -115,10 
             C -115,-45 -65,-45 -35,-10 
             C 10,40 45,95 95,95" 
          fill="none" stroke="url(#mark-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- The Recursive Loopback Arc: Lower tail curves backward and upward into the origin -->
    <path d="M 95,95 
             C 135,95 150,55 125,20 
             C 105,-15 75,-75 35,-75" 
          fill="none" stroke="#00FFA3" stroke-width="10" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.85"/>

    <!-- Signal Focus Nodes -->
    <circle cx="85" cy="-75" r="7" fill="#00F0FF"/>
    <circle cx="-35" cy="-10" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Clean Minimalist Typography -->
  <text x="250" y="425" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="25" letter-spacing="6">RECURSIVE ALPHA</text>
</svg>