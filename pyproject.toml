[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsocnet"
version = "0.3.0"
description = "FinSocNet: Multi-Platform Financial Social Intelligence, Trading Strategy Synthesizer & Terminal UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.1.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "faster-whisper>=1.0.0",
    "prompt-toolkit>=3.0.53",
    "textual>=8.2.8",
    "duckduckgo-search>=7.0.0",
    "ddgs>=9.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
finsocnet = "finsocnet.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
