# FinSocNet stack: the web UI and a worker container with the CLI and skills, sharing ./data.
#
#   docker compose up -d --build
#   docker compose exec worker uv run finsocnet kb stats
#   docker compose exec worker uv run .agents/skills/youtube-extractor/scripts/youtube.py list @Qullamaggie --tab all
#
# data/ is a bind mount, never part of the image (and is git-ignored).
x-finsocnet: &finsocnet
  build:
    context: .
    dockerfile: Dockerfile
  image: finsocnet:latest
  environment:
    KNOWLEDGE_DB_PATH: /app/data/knowledge.db
    FINSOCNET_HOME: /app
    FINSOCNET_EMBED_PROVIDER: ${FINSOCNET_EMBED_PROVIDER:-fastembed}
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  web:
    <<: *finsocnet
    ports:
      - "${PORT:-3001}:3000"
    environment:
      KNOWLEDGE_DB_PATH: /app/data/knowledge.db
      FINSOCNET_HOME: /app
      FINSOCNET_EMBED_PROVIDER: ${FINSOCNET_EMBED_PROVIDER:-fastembed}
      PORT: "3000"
      HOST: 0.0.0.0

  # Idle container to run the CLI and platform skills in: docker compose exec worker <command>
  worker:
    <<: *finsocnet
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "uv run finsocnet kb doctor >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
